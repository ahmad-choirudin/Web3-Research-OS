<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web3 Research OS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Web3 Research OS</h1>
    <p>Research, track, and organize Web3 projects.</p>
  </header>

  <main>

    <div class="search-box">
  <input type="text" placeholder="Search Web3 projects...">
  <button>Search</button>
    </div>

    <section>
  <h2>Overview</h2>

  <div class="overview">
    
    <div class="stat-card">
      <h3>Projects</h3>
      <p>0</p>
    </div>

    <div class="stat-card">
      <h3>Active Quests</h3>
      <p>0</p>
    </div>

    <div class="stat-card">
      <h3>Completed</h3>
      <p>0</p>
    </div>

  </div>
</section>

    <section>
      <h2>My Projects</h2>

      <div>
        <h3>Example Project</h3>
        <p>Ethereum</p>
        <p>Progress: 0%</p>
        <button>View Project</button>
      </div>

    </section>

  </main>

</body>
</html>
